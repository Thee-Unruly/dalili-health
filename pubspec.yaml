name: dalili_health
description: Offline decision support for community health workers (Dalili).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  provider: ^6.1.5+1

  # Navigation
  go_router: ^17.2.3

  # Document Management
  file_picker: ^11.0.3
  archive: ^4.3.0
  xml: ^6.5.0

  # PDF Viewing & Text Extraction
  syncfusion_flutter_pdfviewer: ^33.2.13
  syncfusion_flutter_pdf: ^33.2.13

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # File System
  path_provider: ^2.1.0
  path: ^1.9.0

  # Audio & Voice
  flutter_tts: ^4.1.0
  speech_to_text: ^7.4.0
  whisper_flutter_new: ^1.0.1
  record: ^6.2.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.3
  wakelock_plus: ^1.2.8
  # Denizen AI SDK (Offline AI Engine)
  denizen_ai:
    path: ..
  dalili_triage:
    path: packages/dalili_triage

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_tabler_icons: ^1.43.0

  # Networking (for future model downloads)
  dio: ^5.7.0

  # Permissions (Android)
  permission_handler: ^11.3.1

  # Local Database (future vector/document indexing)
  sqflite: ^2.4.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.11

  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  custom_lint: ^0.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/models/
    - assets/guidelines/




